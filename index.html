<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
  <title>Weekly calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f5;
      --surface: #ffffff;
      --ink: #16181d;
      --muted: #6b7079;
      --line: #e7e7e3;
      --neutral: #f1f1ee;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0f12;
        --surface: #16181d;
        --ink: #eceef2;
        --muted: #8b909a;
        --line: #262931;
        --neutral: #1f2228;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "tnum" 1, "cv11" 1;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 48px 24px 40px;
    }

    /* Header */
    .eyebrow {
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      font-weight: 700;
      letter-spacing: -.025em;
      margin-top: 6px;
    }

    .subtitle {
      color: var(--muted);
      font-size: .95rem;
      margin-top: 6px;
    }

    /* Legend */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      margin: 28px 0 20px;
      font-size: .8rem;
      color: var(--muted);
      list-style: none;
    }

    .legend li { display: flex; align-items: center; gap: 7px; }

    .dot {
      width: 4px;
      height: 14px;
      border-radius: 2px;
      background: var(--c, var(--line));
    }

    .dot.dashed { background: none; border: 1px dashed var(--muted); }

    /* Day tabs (mobile only) */
    .tabs { display: none; }

    /* Grid: rows are time slots, columns are days; blocks are placed explicitly */
    .schedule {
      display: grid;
      grid-template-columns: 96px repeat(7, minmax(0, 1fr));
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px;
    }

    .head, .cell { grid-column: var(--col); }

    .head {
      grid-row: 1;
      font-size: .78rem;
      font-weight: 600;
      color: var(--muted);
      padding: 8px 10px 10px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 4px;
      text-transform: capitalize;
    }

    .head.today { color: var(--ink); }

    .head.today::after {
      content: attr(data-today);
      margin-left: 6px;
      font-size: .65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--surface);
      background: var(--ink);
      border-radius: 4px;
      padding: 1px 5px;
      vertical-align: 1px;
    }

    .time {
      grid-column: 1;
      font-size: .78rem;
      font-weight: 500;
      color: var(--muted);
      padding: 10px 10px 10px 4px;
      display: flex;
      flex-direction: column;
    }

    .time span + span { opacity: .6; }

    .cell {
      --c: var(--muted);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: .84rem;
      min-height: 58px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .cell.tall { justify-content: flex-start; }

    .cell .t { font-weight: 600; }
    .cell .n { font-size: .74rem; color: var(--muted); }

    /* Same background everywhere: colour lives only in the accent bar */
    .accent {
      box-shadow: inset 4px 0 0 var(--c);
      padding-left: 16px;
    }

    .free .t { color: var(--c); }

    .dashed {
      border-style: dashed;
      color: var(--muted);
    }

    .dashed .t { font-weight: 500; }

    footer {
      margin-top: 28px;
      font-size: .78rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
    }

    footer a { color: inherit; text-underline-offset: 3px; }
    footer a:hover { color: var(--ink); }

    /* Mobile: one day at a time */
    @media (max-width: 860px) {
      .container { padding: 28px 16px 32px; }

      .tabs {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        padding: 4px;
        margin-bottom: 14px;
        background: var(--neutral);
        border-radius: 12px;
        position: sticky;
        top: 8px;
        z-index: 1;
      }

      .tab {
        font: inherit;
        font-size: .8rem;
        font-weight: 600;
        color: var(--muted);
        background: none;
        border: 0;
        border-radius: 9px;
        padding: 9px 0;
        cursor: pointer;
        position: relative;
        text-transform: capitalize;
      }

      .tab[aria-selected="true"] {
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
      }

      .tab.today::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 3px;
        width: 4px;
        height: 4px;
        margin-left: -2px;
        border-radius: 50%;
        background: var(--ink);
      }

      .schedule {
        grid-template-columns: 62px 1fr;
        padding: 8px;
      }

      .head { display: none; }
      .cell { grid-column: 2; }
      .cell:not(.on) { display: none; }

      .cell { min-height: 64px; padding: 12px 14px; font-size: .9rem; }
      .accent { padding-left: 18px; }
      .cell .n { font-size: .78rem; }
      .time { padding: 12px 4px; font-size: .74rem; }

      .legend { margin: 20px 0 16px; }
    }

    @media (max-width: 860px) and (prefers-reduced-motion: no-preference) {
      .cell.on { animation: in .18s ease-out; }
      @keyframes in { from { opacity: 0; transform: translateY(2px); } }
    }
  </style>
</head>
<body>

  <main class="container">
    <header>
      <p class="eyebrow"></p>
      <h1></h1>
      <p class="subtitle"></p>
    </header>

    <ul class="legend" aria-label="Legend"></ul>
    <nav class="tabs" role="tablist" aria-label="Day"></nav>
    <div class="schedule" aria-label="Weekly schedule"></div>

    <footer>
      <span class="owner"></span>
      <a class="link"></a>
    </footer>
  </main>

  <script src="schedule.js"></script>
  <script>
    const DAYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
    const { types, events, labels } = schedule;

    const $ = sel => document.querySelector(sel);
    const el = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    };
    const minutes = t => { const [h, m] = t.split(':'); return h * 60 + +m; };
    const color = c => Array.isArray(c) ? `light-dark(${c[0]}, ${c[1]})` : c;
    // 5 Jan 2026 is a Monday
    const dayName = (i, weekday) =>
      new Intl.DateTimeFormat(schedule.lang, { weekday }).format(new Date(2026, 0, 5 + i));

    // Page text
    document.documentElement.lang = schedule.lang;
    document.title = `${schedule.title} · ${schedule.owner.split(' · ')[0]}`;
    $('.eyebrow').textContent = schedule.eyebrow;
    $('h1').textContent = schedule.title;
    $('.subtitle').textContent = schedule.subtitle;
    $('.owner').textContent = schedule.owner;
    $('.link').href = schedule.link;
    $('.link').textContent = schedule.link.replace(/^https?:\/\//, '');

    // Legend
    for (const t of Object.values(types)) {
      const dot = el('span', t.dashed ? 'dot dashed' : 'dot');
      if (t.color) dot.style.setProperty('--c', color(t.color));
      const li = el('li');
      li.append(dot, t.label);
      $('.legend').append(li);
    }

    // Time slots: every distinct start/end time becomes a row boundary
    const times = [...new Set(events.flatMap(e => [e.from, e.to]))]
      .sort((a, b) => minutes(a) - minutes(b));
    const row = t => times.indexOf(t) + 2; // row 1 is the day header

    const grid = $('.schedule');
    const timeHead = el('div', 'head', labels.time);
    timeHead.style.setProperty('--col', 1);
    grid.append(timeHead);

    times.slice(0, -1).forEach((t, k) => {
      const n = el('div', 'time');
      n.style.gridRow = row(t);
      n.append(el('span', null, t), el('span', null, times[k + 1]));
      grid.append(n);
    });

    function block(day, from, to, type, title, note) {
      const t = types[type] || {};
      const c = el('div', 'cell');
      c.dataset.day = day;
      c.style.setProperty('--col', day + 2);
      c.style.gridRow = `${row(from)} / ${row(to)}`;
      if (t.color) { c.classList.add('accent'); c.style.setProperty('--c', color(t.color)); }
      if (t.dashed) c.classList.add('dashed');
      if (type === 'free') c.classList.add('free');
      if (row(to) - row(from) > 1) c.classList.add('tall');
      c.append(el('span', 't', title));
      if (note) c.append(el('span', 'n', note));
      grid.append(c);
    }

    // ponytail: overlapping events on the same day are not detected, they just stack
    DAYS.forEach((key, day) => {
      const head = el('div', 'head', dayName(day, 'long'));
      head.dataset.day = day;
      head.dataset.today = labels.today;
      head.style.setProperty('--col', day + 2);
      grid.append(head);

      const tab = el('button', 'tab', dayName(day, 'short'));
      tab.setAttribute('role', 'tab');
      tab.dataset.day = day;
      $('.tabs').append(tab);

      // Fill every gap between events with an automatic free-time block
      const free = (a, b) => block(day, a, b, 'free', types.free.label, row(b) - row(a) > 1 ? `${a} – ${b}` : null);
      let cursor = times[0];
      events.filter(e => e.days.includes(key))
        .sort((a, b) => minutes(a.from) - minutes(b.from))
        .forEach(e => {
          if (minutes(e.from) > minutes(cursor)) free(cursor, e.from);
          block(day, e.from, e.to, e.type, e.title, e.note);
          cursor = e.to;
        });
      if (cursor !== times.at(-1)) free(cursor, times.at(-1));
    });

    // Day switching on mobile; opens on today
    const today = (new Date().getDay() + 6) % 7;
    const tabs = document.querySelectorAll('.tab');
    const cells = document.querySelectorAll('.cell');

    document.querySelectorAll(`[data-day="${today}"]:is(.head, .tab)`)
      .forEach(n => n.classList.add('today'));

    function show(day) {
      cells.forEach(c => c.classList.toggle('on', c.dataset.day == day));
      tabs.forEach(t => t.setAttribute('aria-selected', t.dataset.day == day));
    }

    tabs.forEach(t => t.addEventListener('click', () => show(t.dataset.day)));
    show(today);
  </script>

</body>
</html>
